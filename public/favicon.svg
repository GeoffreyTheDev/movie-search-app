<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="popcornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#0b081c" stroke="url(#popcornGrad)" stroke-width="2.5" />

  <!-- Popcorn Kernel Fluffs -->
  <circle cx="22" cy="18" r="6" fill="#facc15" filter="url(#glow)" />
  <circle cx="32" cy="14" r="7" fill="#fde047" filter="url(#glow)" />
  <circle cx="42" cy="18" r="6" fill="#facc15" filter="url(#glow)" />

  <!-- Bucket Body -->
  <path d="M 18 26 L 22 52 C 22 54 24 55 26 55 L 38 55 C 40 55 42 54 42 52 L 46 26 Z" fill="url(#popcornGrad)" filter="url(#glow)" />

  <!-- Bucket Stripes -->
  <path d="M 27 26 L 28 55 M 37 26 L 36 55" stroke="#0b081c" stroke-width="2.5" stroke-linecap="round" />
</svg>